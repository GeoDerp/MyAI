[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myai"
version = "0.1.0"
description = "Personal Research Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai[openai]>=1.0.0",
    "duckduckgo-search>=6.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "redis>=4.6.0",
    "ddgs>=1.0.0",
    "pydantic>=2.12.0",
    "flask>=2.3.0",
]

[project.optional-dependencies]
providers = [
    "pydantic-ai[anthropic]>=1.0.0",
    "pydantic-ai[google]>=1.0.0",
]

dev = [
    "logfire>=0.50.0",
    "mypy>=1.8.0",
]

testing = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["myai*"]

[project.scripts]
research-agent = "myai.research_agent_example:main"
