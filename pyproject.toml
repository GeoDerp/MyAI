[project]
name = "myai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core/runtime dependencies for the research agent
    "pydantic-ai[openai]>=1.0.0",
    "duckduckgo-search>=6.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Optional providers and tooling
providers = [
    "pydantic-ai[anthropic]>=1.0.0",
    "pydantic-ai[google]>=1.0.0",
]

dev = [
    "logfire>=0.50.0",
    "mypy>=1.8.0",
]

testing = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
