[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myai"
version = "0.1.0"
description = "Personal Research Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.30",
    "langchain>=0.1.16",
    "langchain-community>=0.0.32",
    "langchain-openai>=0.1.3",
    "litellm>=1.34.1",
    "ollama>=0.1.8",
    "llama-parse>=0.1.2",
    "exa-py>=1.0.5",
    "arxiv>=2.1.0",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "redis>=4.6.0",
    "pydantic>=2.12.0",
    "flask>=2.3.0",
    "pydantic-ai>=0.1.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
providers = [
    "pydantic-ai[anthropic]>=1.0.0",
    "pydantic-ai[google]>=1.0.0",
]

dev = [
    "logfire>=0.50.0",
    "mypy>=1.8.0",
]

testing = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["myai*"]

[project.scripts]
research-agent = "myai.research_agent_example:main"
