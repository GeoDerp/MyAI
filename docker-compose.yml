version: '3.8'
services:
  webui:
    image: myai-webui:latest
    build:
      context: .
      dockerfile: Dockerfile.webui
    environment:
      - PORT=8081
      - HOST=0.0.0.0
      # Optional: set MYAI_DEBUG_FILE to enable file-backed debug logging inside the container
      # - MYAI_DEBUG_FILE=/var/log/myai_debug.log
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - myai-net
    volumes:
      - myai_logs:/var/log/myai

  # Example RamaLama service for local demos. Uncomment and set image/command as needed.
  # ramalama:
  #   image: quay.io/ramalama/ramalama:latest
  #   command: ramalama serve --ngl 0 --image granite4:small-h --port 8080 --name research-agent
  #   ports:
  #     - "8080:8080"
  #   restart: unless-stopped
  #   networks:
  #     - myai-net

  myai-redis:
    image: docker.io/library/redis:7-alpine
    container_name: myai-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - myai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  myai-net:
    driver: bridge

volumes:
  myai_logs:
    driver: local
  # Persistent Redis data for production caching
  redis_data:
    driver: local
